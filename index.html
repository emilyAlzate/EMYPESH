
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">

  <title>EMYPESH | Portafolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: #000000;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* MENÚ */

    header {
      width: 100%;
      padding: 28px 20px;
      background: #000000;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }

    nav button {
      border: 1px solid #ffffff;
      border-radius: 50px;
      background: transparent;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    nav button:hover,
    nav button.activo {
      background: transparent;
      color: #ffffff;
      border-color: #ffffff;
    }

    nav button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    /* CONTENIDO Y SCROLL */

    main {
      width: 100%;
      min-height: calc(100vh - 90px);
      padding: 20px 3% 80px;
      background: #000000;
      overflow: visible;
    }

    .seccion {
      display: none;
      width: 100%;
    }

    .seccion.activa {
      display: block;
    }

    /* IMÁGENES GRANDES */

    .imagen-contenedor {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
    }

    .imagen-contenedor img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1200px;
      max-height: none;
      object-fit: contain;
    }
