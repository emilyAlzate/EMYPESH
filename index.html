    header {
      width: 100%;

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }

    nav button {
      border: 1px solid #ffffff;
      border-radius: 50px;
      background: transparent;
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.25s ease,
                  color 0.25s ease;
    }

    nav button:hover,
    nav button.activo {
      background: transparent;
      color: #ffffff;
      border-color: #ffffff;
    }

    nav button:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 4px;
    }

    /* CONTENIDO */

    main {
      width: 100%;
      min-height: calc(100vh - 90px);
      padding: 20px 5% 50px;
      background: #000000;
    }

    .seccion {
      display: none;
      width: 100%;
    }

    .seccion.activa {
      display: block;
    }

    /* IMÁGENES */

    .imagen-contenedor {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .imagen-contenedor img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
    }

    /* MÓVILES */

    @media (max-width: 600px) {
      header {
        padding: 22px 12px;
      }

      nav {
        gap: 8px;
      }

      nav button {
        font-size: 10px;
        letter-spacing: 0.5px;
        padding: 10px 13px;
      }

      main {
        padding: 18px 12px 35px;
      }

      .imagen-contenedor img {
        max-height: 75vh;
      }
    }
  </style>
</head>
